# 每日定时服务。批量补跑 / QA 生成用 `docker compose run --rm` 临时覆盖 command。
# 不映射端口：代码里没有 HTTP 监听，原 ReadMe 的 -p 8887-8889 属于无效映射。
services:
  xiaoxin:
    build: .
    image: xiaoxin:v1
    container_name: xiaoxin_qa
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "app.py"]

# 批量补跑：
#   docker compose run --rm xiaoxin python app.py --mode batch --start 2026-04-01 --end 2026-04-28
# 生成 QA：
#   docker compose run --rm xiaoxin python generate_qa.py --start 2026-04-01 --end 2026-04-28
# 上线自检：
#   docker compose run --rm xiaoxin python verify_env.py
