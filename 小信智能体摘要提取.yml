            ---\n## 标准设备列表\n智能手机\n老年机\n手表\n儿童手表\n电脑\n云电脑终端\n座机/话机\n光猫\nONU设备\n宽带ONT\n\
            路由器\n智能网关\n机顶盒/OTT盒子\n电视机\n摄像头\n安防设备\n监控设备\n智能控制器\nSIM卡\nUSIM卡\n上网卡\n\
            流量卡\n通信模组\n线盒\n光纤入户设备\n全屋WiFi设备\n智能组网设备\nPOS机\n物联网卡\n物联网终端\n警务通终端\n车务通终端\n\
            遥控器\n云PAD\n云手机\n无\n---\n# 识别规则\n1. 若输入中出现多个设备：\n   - 优先选择被描述为有故障、异常、无法使用、损坏的那个\n\
            2. 若未明确涉及上述任一类别，则输出：“无”。\n3.必须基于输入内容中**显式提到完整设备名称**的词汇进行提取，不能推测、猜测或联想设备类型。\n\
