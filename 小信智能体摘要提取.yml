    - data:
        code: "import json\nimport re\n\ndef main(device, business, symptom, symptom_detail,\
          \ cause, branch_actions, vendor_actions, subclass):\n    def process(text):\n\
          \        cleaned = re.sub(r'[\\r\\n]+', '', text)\n        cleaned = re.sub(r\"\
          <think>.*?</think>\", \"\", cleaned, flags=re.DOTALL).replace(\" \", \"\"\
          )\n        \n        return cleaned\n    data = {\n        \"device\": process(device),\n\
          \        \"business\": process(business),\n        \"subclass\": process(subclass),\n\
          \        \"symptom\": process(symptom),\n        \"symptom_detail\": process(symptom_detail),\n\
          \        \"cause\": process(cause),\n        \"branch_actions\": process(branch_actions),\n\
          \        \"vendor_actions\": process(vendor_actions)\n    }\n    return\
